<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Device Registration (scan QR)</title>
  <style>
    :root { --bg:#0f1420; --panel:#1a2130; --border:#2c3648; --text:#e6ebf2; --muted:#8b97a8; --accent:#4f8cff; --green:#2ecc71; --red:#e74c3c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; align-items:center; padding:24px; }
    h1 { font-size:20px; }
    .ver { color:var(--accent); font-size:14px; }
    .wrap { width:100%; max-width:640px; }
    video { width:100%; border-radius:10px; border:1px solid var(--border); background:#000; }
    #result { margin-top:16px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; font-family:Consolas,monospace; font-size:13px; white-space:pre-wrap; }
    .ok { color:var(--green); }
    .err { color:var(--red); }
    button { margin-top:12px; padding:9px 18px; background:var(--accent); color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:14px; }
    .hint { color:var(--muted); font-size:13px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Device Registration <span class="ver">(scan QR)</span></h1>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none"></canvas>
    <div id="result">Point the camera at a device QR code…</div>
    <button id="btn-rescan" style="display:none">Scan another</button>
    <p class="hint">Scanning decodes the QR, fetches the device's certificate from the device-manager, and saves it under <code>v5.0/certs/</code>.</p>
  </div>
  <script src="/jsqr.js"></script>
  <script src="/scan.js"></script>
</body>
</html>
