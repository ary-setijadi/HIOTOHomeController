; MQTT TLS terminator — lets TLS-capable devices (ESP32) reach RabbitMQ 3.8.3,
; whose own MQTT-TLS listener (8883) crashes on connect. stunnel terminates TLS
; and forwards the decrypted MQTT stream to the broker's plaintext 1883 on loopback.
;
; Install: apt install stunnel4
; Deploy:  copy this file to /etc/stunnel/mqtt-tls.conf
;           set ENABLED=1 in /etc/default/stunnel4
;           systemctl enable --now stunnel4
; Certs:   see tools/gen-device-cert.sh and the device development guide.

[mqtt-tls]
client  = no
accept  = 8883
connect = 127.0.0.1:1883

cert   = /etc/stunnel/certs/server.crt
key    = /etc/stunnel/certs/server.key
CAfile = /etc/stunnel/certs/ca.crt

; verify = 2  -> require + verify a client cert (mTLS, recommended)
; verify = 0  -> server-only TLS (client just trusts the CA)
verify = 2
