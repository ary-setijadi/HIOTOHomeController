# V4m — plaintext (legacy devices 1883, controller 5672) + AMQP TLS (agent 5671).
# Reference copy for the stand-by board. Normally restored from the primary's
# backup; this file is the fallback if no backup is available.
mqtt.exchange = home.automation
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
ssl_options.certfile = /etc/rabbitmq/certs/rabbitmq-server.crt
ssl_options.keyfile = /etc/rabbitmq/certs/rabbitmq-server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
