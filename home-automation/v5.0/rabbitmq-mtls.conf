# v5.0 mTLS — RabbitMQ 3.8 (combined with mqtt.exchange)
# Plaintext listeners (5672/1883/15672) remain active during the transition;
# TLS listeners (5671/8883/15671) are added alongside.

mqtt.exchange = home.automation

# ---- AMQP over TLS (controller) + MQTT over TLS (devices/UI) ----
# In RabbitMQ 3.8 the MQTT plugin shares the top-level ssl_options block.
# Plaintext data-plane listeners are bound to loopback only, so remote
# clients (192.168.137.x) must use the TLS listeners (5671/8883).
listeners.ssl.default            = 5671
listeners.tcp.default            = 127.0.0.1:5672
mqtt.listeners.ssl.default       = 8883
mqtt.listeners.tcp.default       = 127.0.0.1:1883
ssl_options.cacertfile           = /etc/rabbitmq/certs/ca.crt
ssl_options.certfile             = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile              = /etc/rabbitmq/certs/server.key
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = true

# ---- management over HTTPS (browser-usable: server-only TLS) ----
management.ssl.port          = 15671
management.ssl.cacertfile    = /etc/rabbitmq/certs/ca.crt
management.ssl.certfile      = /etc/rabbitmq/certs/server.crt
management.ssl.keyfile       = /etc/rabbitmq/certs/server.key
management.ssl.verify        = verify_none
management.ssl.fail_if_no_peer_cert = false
