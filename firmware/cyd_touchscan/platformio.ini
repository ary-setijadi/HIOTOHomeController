; =============================================================================
;  CYD touch bus scanner - find out which pins the XPT2046 actually listens on.
;
;  Tests two hypotheses simultaneously and prints/display the result:
;    A) hardware SPI on 25/32/39/33  - the classic CYD wiring (PINS.md)
;    B) bit-banged SPI on 13/14/12 with CS 33 - touch sharing the display bus
;
;  Whichever candidate shows a growing span while a finger is held is the truth.
;  BOOT (GPIO0) resets the learned min/max so you can start a clean measurement.
;
;  Build: pio run -e st7789
; =============================================================================

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43

[cyd_flags]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_MISO=12
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

[env:st7789]
extends = env
build_flags =
    ${cyd_flags.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB
