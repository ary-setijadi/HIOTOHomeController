; =============================================================================
;  CYD touch RETEST - single known bus, raw 16-bit words, no gating.
;
;  Earlier runs disagree: the first probe saw X/Y/z track the finger, the later
;  scan saw frozen 0x807F. Most likely cause is press/sample timing overlap.
;
;  This version:
;    - uses ONLY the documented bus (CLK 25, MOSI 32, MISO 39, CS 33)
;    - logs the complete 16-bit word for X, Y and Z on every sample, plus IRQ
;    - tracks min/max of the raw words so any bit movement is provable
;    - shows the same numbers live on the panel
;
;  Nothing is gated on IRQ: the log itself tells us whether a sample was taken
;  during contact.
;
;  Build: pio run -e st7789
; =============================================================================

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43

[cyd_flags]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_MISO=12
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

[env:st7789]
extends = env
build_flags =
    ${cyd_flags.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB
