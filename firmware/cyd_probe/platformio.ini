; =============================================================================
;  CYD Hardware Probe - ESP32-2432S028 (2.8" "Cheap Yellow Display")
;
;  Purpose: read the REAL display controller ID over SPI (register-level, not
;  a library guess) and report the state of every on-board peripheral.
;  Output goes to both the TFT and the serial port @115200.
;
;  Pick the environment that matches the panel:
;    env:st7789   -> dual USB (micro-USB + USB-C) 2.8" CYD
;    env:ili9341  -> single micro-USB "R" classic 2.8" CYD
;
;  Build:  pio run -e st7789
;  Flash:  this board cannot auto-reset (EN cap too small / known CYD issue),
;          so enter download mode by hand: hold BOOT, tap RST, release BOOT.
;            pio run -e st7789 -t upload --upload-port COM3
;  Watch:  pio device monitor -p COM3 -b 115200
; =============================================================================

[env]
platform = espressif32@6.9.0          ; Arduino core 2.x - known-good with TFT_eSPI
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = direct, printable
upload_speed = 115200                  ; CH340 + manual reset: keep it slow/safe
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_src_filter = +<*>

; ---- TFT_eSPI pin map: identical on both 2.8" CYD variants ------------------
[cyd_flags]
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_MISO=12
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

; ---- dual-USB variant: ST7789 240x320 --------------------------------------
[env:st7789]
extends = env
build_flags =
    ${cyd_flags.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB            ; swap to TFT_BGR if red/blue are swapped
; -DTFT_INVERSION_ON                   ; uncomment if the image looks like a negative

; ---- single-USB "R" classic: ILI9341 240x320 -------------------------------
[env:ili9341]
extends = env
build_flags =
    ${cyd_flags.build_flags}
    -DILI9341_2_DRIVER=1               ; "alt" ILI9341 init - the CYD needs this one
    -DTFT_RGB_ORDER=TFT_BGR            ; BGR is the CYD ILI9341 default
