; =============================================================================
;  HIOTO General Monitor — lamp switch panel
;  Target board: Sunton ESP32-3248S035 (classic 3.5" CYD, 320x480 native)
;    - ESP32-D0WD-V3, 4 MB flash, no PSRAM
;    - ST7796 3.5" panel driven as 480x320 landscape (rotation 1)
;    - XPT2046 resistive touch (shared SPI bus), LDR, RGB LED, CH340 @ COM3
;
;  A simple lamp switch panel:
;    - Title bar [Floor] · [Room]
;    - 2 x 4 big buttons, each with a lamp icon + name, tapping toggles the lamp
;      (HIOTO Aktuator, active-low: 0 = ON, 1 = OFF)
;    - "Setelan" pill opens settings: WiFi, Floor/Room, and per-button device +
;      icon assignment (stored in NVS)
;
;  Build:   python -m platformio run -e hioto_genmon
;  Flash:   tools\flash.ps1  (manual download mode: hold BOOT while powering)
; =============================================================================

[env:hioto_genmon]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<calib.cpp>

build_flags =
  -DCORE_DEBUG_LEVEL=2
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT
  -DST7796_DRIVER=1
  -DFW_DEVICE_TYPE=\"hioto-genmon-35\"
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_MISO=12
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_RGB_ORDER=TFT_RGB
  -DTOUCH_CS=33
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.4.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0

upload_port = COM3
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; =============================================================================
;  2.8" CYD (Sunton ESP32-2432S028R): ILI9341 240x320 native, driven as
;  320x240 landscape. SPI wiring identical, backlight on GPIO 21.
;  The UI picks a compact layout automatically from LCD_WIDTH/LCD_HEIGHT.
; =============================================================================
[env:hioto_genmon28]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<calib.cpp>

build_flags =
  -DCORE_DEBUG_LEVEL=2
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT
  -DST7789_DRIVER=1
  -DFW_DEVICE_TYPE=\"hioto-genmon-28\"
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_MISO=12
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DPIN_LCD_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_RGB_ORDER=TFT_RGB
  -DTOUCH_SEPARATE_BUS=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.4.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0

upload_port = COM3
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
