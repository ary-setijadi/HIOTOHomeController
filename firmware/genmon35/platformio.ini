; =============================================================================
;  HIOTO General Monitor - 3.5" CYD  (Sunton ESP32-3248S035 / ST7796)
;
;  This is a SELF-CONTAINED project for ONE device family. It deliberately
;  shares no source tree with the 2.8" ST7789 build: the two panels are
;  different devices with different controllers, touch topologies, button
;  counts, version series and OTA channels. Keeping them apart means a change
;  for one board can never silently compile into the other's image.
;
;    Device type : hioto-genmon-35-st7796
;    Version     : 3.5.x series (independent of 2.8.x)
;    Panel       : ST7796, 320x480 native -> 480x320 landscape
;    Buttons     : GEN_SLOTS=8  (4 columns x 2 rows)
;    Touch       : XPT2046 on the DISPLAY SPI bus (TOUCH_CS=33, TFT_eSPI path)
;    Backlight   : GPIO 27, active HIGH
;    OTA channel : /srv/ota/hioto-genmon-35-st7796/
;
;  Build : pio run
;  Flash : pio run -t upload    (manual download mode: hold BOOT, reconnect USB)
; =============================================================================

[env:genmon_35_st7796]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<calib.cpp>

build_flags =
  -DCORE_DEBUG_LEVEL=2
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT
  -DST7796_DRIVER=1
  -DFW_DEVICE_TYPE=\"hioto-genmon-35-st7796\"
  -DFW_PANEL_CHIP=\"ST7796\"
  -DGEN_SLOTS=8            ; 4 columns x 2 rows = 8 lamp buttons
  -DFW_VERSION=\"3.5.5\"   ; 3.5" series - bumped independently of 2.8.x
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_MISO=12
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_RGB_ORDER=TFT_RGB
  -DTOUCH_CS=33
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.4.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0

upload_port = COM3
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
