; =============================================================================
;  HIOTO Floor Monitor — Type F · v1.0
;  Target board: Sunton ESP32-3248S035 (classic 3.5" CYD)
;    - ESP32-D0WD-V3 (dual core, 240 MHz), 4 MB SPI flash, NO PSRAM
;    - Display : ST7796 480x320 SPI (HSPI pins), BL on GPIO27
;    - Touch   : XPT2046 resistive, shared display SPI bus, CS=GPIO33
;    - Inputs  : LDR on GPIO34, BOOT on GPIO0, RGB LED on 4/16/17
;    - USB-UART: CH340  ->  COM3
;
;  Milestone: v1.0 — floor monitoring dashboard:
;    - NVS settings + Wi-Fi captive-portal provisioning
;    - MQTT: publishes iot/{id}/telemetry|status, subscribes iot/# + HIOTO
;      legacy topics to build a live per-floor node list
;    - LVGL UI: dashboard / node detail / system info, touch + BOOT button
;
;  Commands:
;    python -m platformio run                 build
;    ; flashing this board needs manual download mode (hold BOOT, tap RESET):
;    python -m esptool.py --port COM3 --before no_reset --after hard_reset \
;        write_flash 0x1000 bootloader.bin 0x8000 partitions.bin 0xe000 boot_app0.bin \
;        0x10000 firmware.bin
;    python -m platformio device monitor      serial console @115200
; =============================================================================

[env:hioto_3248s035]
platform = espressif32@6.9.0          ; Arduino core 2.x — known-good with TFT_eSPI
board = esp32dev
framework = arduino

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv ; 3 MB app slot on the 4 MB flash
build_src_filter = +<*> -<smoke.cpp> -<calib.cpp>   ; test tools are separate envs

build_flags =
  -DCORE_DEBUG_LEVEL=2
  ; ---- LVGL (8.4): project lv_conf.h lives in include/.
  ;      The explicit -I is required: library compile units (lvgl, TFT_eSPI)
  ;      otherwise don't see the project include dir, so lv_conf.h would be
  ;      silently skipped and e.g. the enabled fonts never get built.
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE

  ; ---- TFT_eSPI: ST7796 480x320 + XPT2046 on the shared SPI bus
  ;      (USER_SETUP_LOADED=1 bypasses the library's own User_Setup.h)
  ;      The display pins are the HSPI defaults on this board -> USE_HSPI_PORT.
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_MISO=12
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1              ; TFT reset is tied to the module EN pin
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_RGB_ORDER=TFT_RGB   ; switch to TFT_BGR if red/blue are swapped
  -DTOUCH_CS=33             ; XPT2046 chip-select (RTP_CS on 3248S035)
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.4.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0

; The board enumerates as CH340 on COM3. Pin the port so upload never
; accidentally hits another serial adapter.
upload_port = COM3
upload_speed = 921600

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
;  Touch calibration tool: draws big numbered targets, prints raw values and
;  stores the calibration in NVS so the main app picks it up automatically.
;    python -m platformio run -e calib -t upload   (manual download mode!)
; ---------------------------------------------------------------------------
[env:calib]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
build_src_filter = -<*> +<calib.cpp>
build_flags =
  -Iinclude
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_MISO=12
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_RGB_ORDER=TFT_RGB
  -DTOUCH_CS=33
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
upload_port = COM3
upload_speed = 921600
monitor_speed = 115200

; ---------------------------------------------------------------------------
;  Bring-up smoke test: minimal sketch, no display/LVGL config.
;    python -m platformio run -e smoke -t upload
; ---------------------------------------------------------------------------
[env:smoke]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<smoke.cpp>
upload_port = COM3
upload_speed = 921600
monitor_speed = 115200
