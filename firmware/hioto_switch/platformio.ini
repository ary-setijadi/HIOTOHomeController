; =============================================================================
;  HIOTO Secured Switch — Type A · v1.0
;  Target board: Sunton ESP32-1732S019C
;    - ESP32-S3-WROOM-1 (N16): 16 MB QIO flash (no PSRAM detected on this unit)
;    - Display : ST7789, 170x320, SPI
;    - Touch   : GT911, I2C (auto-probed at boot)
;    - USB-UART: CH340  ->  COM3
;
;  Milestone 1: demo firmware — display bring-up + interactive LVGL UI.
;  Milestone 2 (next): switch-device skeleton (Wi-Fi + MQTT + NVS + relay).
;
;  Commands:
;    python -m platformio run                 build the demo
;    python -m platformio run -t upload       flash over COM3 (CH340)
;    python -m platformio device monitor      serial console @115200
; =============================================================================

[env:hioto_1732s019c]
platform = espressif32@6.9.0          ; Arduino core 2.x — known-good with TFT_eSPI
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB              ; also stamp 16MB into firmware header
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<smoke.cpp>        ; smoke.cpp belongs to the [env:smoke] test

build_flags =
  -DCORE_DEBUG_LEVEL=2
  ; ---- LVGL (8.4): project lv_conf.h lives in include/.
  ;      The explicit -I is required: library compile units (lvgl, TFT_eSPI)
  ;      otherwise don't see the project include dir, so lv_conf.h would be
  ;      silently skipped and e.g. the enabled fonts never get built.
  ;      (Relative path: compile commands run with the project root as cwd.)
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  ; ---- TFT_eSPI: pin map for the ESP32-1732S019C
  ;      (USER_SETUP_LOADED=1 bypasses the library's own User_Setup.h)
  ;      USE_HSPI_PORT is REQUIRED on ESP32-S3 with Arduino core 2.x:
  ;      the default FSPI index resolves to 0 in soc.h REG_SPI_BASE(),
  ;      which crashed TFT_eSPI::init() with StoreProhibited (addr 0x10).
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT
  -DST7789_DRIVER=1
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_MOSI=13
  -DTFT_SCLK=12
  -DTFT_MISO=-1
  -DTFT_CS=10
  -DTFT_DC=11
  -DTFT_RST=1
  -DTFT_BL=14
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_INVERSION_ON          ; colors correct on most panels; remove if inverted
  -DTFT_RGB_ORDER=TFT_RGB     ; switch to TFT_BGR if red/blue are swapped
  -DSPI_FREQUENCY=40000000    ; conservative start; 65000000-80000000 often works
  -DSPI_READ_FREQUENCY=20000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.4.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0

; The board enumerates as CH340 on COM3. Pin the port so upload never
; accidentally hits another serial adapter.
upload_port = COM3
upload_speed = 921600

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
;  Bring-up smoke test: minimal sketch, no PSRAM/display config.
;    python -m platformio run -e smoke -t upload
; ---------------------------------------------------------------------------
[env:smoke]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi   ; quad PSRAM probe (2 MB R2 variant)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = -<*> +<smoke.cpp>
upload_port = COM3
upload_speed = 921600
monitor_speed = 115200
