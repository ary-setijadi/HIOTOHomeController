; =============================================================================
;  HIOTO General Monitor - 2.8" CYD  (Sunton ESP32-2432S028 / ST7789)
;
;  This is a SELF-CONTAINED project for ONE device family. It deliberately
;  shares no source tree with the 3.5" ST7796 build: the two panels are
;  different devices with different controllers, touch topologies, button
;  counts, version series and OTA channels. Keeping them apart means a change
;  for one board can never silently compile into the other's image.
;
;    Device type : hioto-genmon-28-st7789
;    Version     : 2.8.x series (independent of 3.5.x)
;    Panel       : ST7789, 240x320 native -> 320x240 landscape
;    Buttons     : GEN_SLOTS=6  (3 columns x 2 rows)
;    Touch       : XPT2046 on its OWN bus - clk25 mosi32 miso39 cs33 irq36
;                  (TOUCH_SEPARATE_BUS; TOUCH_CS is unusable here)
;    Backlight   : GPIO 21, active HIGH
;    OTA channel : /srv/ota/hioto-genmon-28-st7789/
;
;  Build : pio run
;  Flash : pio run -t upload    (manual download mode: hold BOOT, reconnect USB)
; =============================================================================

[env:genmon_28_st7789]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<calib.cpp>

build_flags =
  -DCORE_DEBUG_LEVEL=2
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT
  -DST7789_DRIVER=1
  -DFW_DEVICE_TYPE=\"hioto-genmon-28-st7789\"
  -DFW_PANEL_CHIP=\"ST7789\"
  -DGEN_SLOTS=6            ; 3 columns x 2 rows = 6 lamp buttons (320 px wide)
  -DFW_VERSION=\"2.8.5\"   ; 2.8" series - bumped independently of 3.5.x
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_MISO=12
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DPIN_LCD_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_RGB_ORDER=TFT_RGB
  -DTOUCH_SEPARATE_BUS=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.4.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0

upload_port = COM3
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
