; =============================================================================
;  CYD Findings Demo UI - ESP32-2432S028 (2.8" Cheap Yellow Display)
;
;  A touch/BOOT-driven UI that presents the verified hardware findings on the
;  panel itself, including the "garbage vs clean" driver comparison.
;
;  Built for the panel that is actually fitted to this unit: ST7789.
;
;  Build:  pio run -e st7789
;  Flash:  hold BOOT, reconnect USB, release BOOT after ~2 s, then
;            pio run -e st7789 -t upload --upload-port COM3
; =============================================================================

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43

[cyd_flags]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_MISO=12
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; The panel on this unit is ST7789 (proven by driver test on the real hardware).
[env:st7789]
extends = env
build_flags =
    ${cyd_flags.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB

; Kept for A/B comparison only: this is the config that produced the garbage.
[env:ili9341_broken]
extends = env
build_flags =
    ${cyd_flags.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
